<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MR Triage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>🚦</text></svg>">
<style>
:root{
  --navy:#1C2436; --midnavy:#617394; --lightgrey:#E8EBF0;
  --green:#10C180; --blue:#4D61E5; --red:#FC5963; --yellow:#FCCF29; --purple:#804DA1;

  --bg:#F4F6FA; --panel:#FFFFFF; --panel-2:#FAFBFD;
  --line:#E1E6EF; --line-strong:#CFD6E3;
  --text:#1C2436; --text-dim:#5A6B8C; --text-faint:#8A97B0;
  --crit:#D93B47; --crit-bg:rgba(252,89,99,.10); --crit-line:rgba(252,89,99,.45);
  --warn:#9A7400; --warn-bg:rgba(252,207,41,.16); --warn-line:rgba(230,180,20,.55);
  --ok:#0E9E69;
  --accent:#4D61E5; --accent-soft:rgba(77,97,229,.10);
  --chip:#EEF1F7; --hover:#F0F3F9;
  --shadow:0 1px 2px rgba(28,36,54,.06), 0 1px 0 rgba(28,36,54,.03);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E121B; --panel:#161C29; --panel-2:#131926;
    --line:#242D40; --line-strong:#32405C;
    --text:#E8EBF0; --text-dim:#98A5BF; --text-faint:#6C7A96;
    --crit:#FF7078; --crit-bg:rgba(252,89,99,.13); --crit-line:rgba(252,89,99,.5);
    --warn:#F0C43D; --warn-bg:rgba(252,207,41,.11); --warn-line:rgba(252,207,41,.42);
    --ok:#2ED8A0;
    --accent:#8496FF; --accent-soft:rgba(122,140,232,.16);
    --chip:#1E2637; --hover:#1C2434;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:940px;margin:0 auto;padding:0 14px 56px}

/* ── top bar ───────────────────────────────────────────── */
.top{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(160%) blur(8px);
  border-bottom:1px solid var(--line);
  margin:0 -14px 12px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:7px;margin-right:auto;min-width:0}
.brand b{font-size:14px;font-weight:700;letter-spacing:-.02em}
.dots{display:inline-flex;gap:3px;align-items:center;margin-right:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--green);display:block}
.dots i:nth-child(2){background:var(--blue);opacity:.85}
.dots i:nth-child(3){background:var(--midnavy);opacity:.5}
.alarm{
  display:none;align-items:center;gap:5px;
  color:var(--crit);font-weight:650;font-size:12px;
  background:var(--crit-bg);border:1px solid var(--crit-line);
  padding:2px 8px;border-radius:999px;
}
.alarm.on{display:inline-flex}
.alarm .pulse{width:6px;height:6px;border-radius:50%;background:var(--crit);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.seg{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{
  padding:3px 10px;border-radius:5px;font-size:12px;font-weight:550;color:var(--text-dim);
  letter-spacing:.01em;
}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:var(--shadow);font-weight:650}
@media (prefers-color-scheme: dark){ .seg button[aria-pressed="true"]{background:#2A344A} }

.bell{padding:3px 9px;border-radius:7px;border:1px solid var(--line);background:var(--chip);font-size:13px;color:var(--text-dim);line-height:1.4;opacity:.55}
.bell[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);opacity:1}
.bell:disabled{opacity:.3;cursor:not-allowed}
.notify-wrap{position:relative;display:flex;align-items:center;gap:4px}
.gear{padding:3px 7px;border-radius:7px;border:1px solid var(--line);background:var(--chip);font-size:12px;color:var(--text-dim);opacity:.55}
.gear:hover,.gear[aria-expanded="true"]{opacity:1}
.notify-panel{
  position:absolute;top:calc(100% + 6px);right:0;z-index:30;min-width:200px;
  background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px 10px;
}
.notify-panel h4{margin:0 0 6px;font-size:10.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint)}
.notify-panel label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text);padding:3px 0;cursor:pointer}
.notify-panel input{margin:0}
.status{font-size:11.5px;color:var(--text-faint);white-space:nowrap;display:flex;align-items:center;gap:6px}
.ring{
  --pct:0; flex:none;width:11px;height:11px;border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--line-strong) 0);
  transition:background .2s linear;
}
.status.err{color:var(--crit);font-weight:600}
.demo{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.8}

/* ── warnings ──────────────────────────────────────────── */
.warns{
  border:1px dashed var(--line-strong);border-left:3px solid var(--purple);
  background:var(--panel-2);border-radius:8px;padding:8px 11px;margin-bottom:12px;
}
.warns h3{margin:0 0 3px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--purple)}
.warns ul{margin:0;padding-left:16px;color:var(--text-dim);font-size:12px}
.warns li{margin:1px 0}

/* ── groups ────────────────────────────────────────────── */
.group{
  background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;
  margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden;
}
.group>summary{
  list-style:none;cursor:pointer;padding:11px 13px;
  background:var(--panel-2);border-bottom:1px solid var(--line-strong);
  display:flex;align-items:center;gap:9px;user-select:none;
}
.group[open]>summary{border-bottom:1px solid var(--line-strong)}
.group:not([open])>summary{border-bottom:0}
.group>summary::-webkit-details-marker{display:none}
.group>summary:hover{background:var(--hover)}
.caret{flex:none;color:var(--text-faint);transition:transform .12s ease;transform:rotate(-90deg)}
.group[open] .caret{transform:rotate(0)}
.gavatar{
  flex:none;width:22px;height:22px;border-radius:6px;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:750;letter-spacing:0;
}
.gname{font-weight:750;font-size:14.5px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gname .dim{color:var(--text-faint);font-weight:500;font-size:12.5px}
.gmeta{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.count{font-size:11px;color:var(--text-faint);font-weight:600}
.favBtn{font-size:15px;line-height:1;color:var(--text-faint);padding:0 1px}
.favBtn:hover{color:var(--warn)}
.favBtn.on{color:var(--warn)}
.section-label{font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin:4px 2px 6px}
.group.pinned{border-color:var(--warn-line)}
#watched:not(:empty){margin-bottom:18px;padding-bottom:10px;border-bottom:1px dashed var(--line-strong)}
.badge{
  font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;line-height:1.5;
}
.badge.crit{color:var(--crit);background:var(--crit-bg);border:1px solid var(--crit-line)}
.badge.warn{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line)}
.badge.bot{color:var(--text-faint);background:var(--chip);border:1px solid var(--line);font-weight:650;letter-spacing:.04em;text-transform:uppercase;font-size:9.5px}

/* ── rows ──────────────────────────────────────────────── */
.rows{border-top:1px solid var(--line)}
.row{
  display:flex;align-items:center;gap:9px;
  padding:6px 11px 6px 8px;
  border-left:3px solid transparent;
  border-bottom:1px solid var(--line);
  position:relative;
}
.rows .row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row.crit{border-left-color:var(--crit);background:color-mix(in srgb,var(--crit-bg) 45%,transparent)}
.row.crit:hover{background:color-mix(in srgb,var(--crit-bg) 65%,var(--hover))}
.row.warn{border-left-color:var(--warn-line)}
.row.quiet{opacity:.62}
.row.quiet:hover{opacity:1}

.grip{flex:none;cursor:grab;color:var(--text-faint);font-size:12px;padding:0 1px;user-select:none}
.drop-end{height:10px}
.drop-end.over{height:10px;background:var(--accent-soft);border-top:2px solid var(--accent)}
.grip:active{cursor:grabbing}
.row.dragging{opacity:.35}
.rel{flex:none;width:9px;height:9px;border-radius:50%;box-sizing:border-box}
.rel.authored{background:var(--green)}
.rel.reviewing{background:transparent;border:2px solid var(--blue)}
.rel.other{background:transparent;border:1px solid var(--line-strong)}

.main{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:7px}
.title{
  flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text);font-weight:520;font-size:13px;letter-spacing:-.005em;
}
.title:hover{color:var(--accent)}
.row.draft .title{color:var(--text-dim);font-weight:450}

.tags{flex:none;display:flex;align-items:center;gap:4px}
.tag{
  font-size:10.5px;font-weight:650;line-height:1.6;padding:0 5px;border-radius:4px;white-space:nowrap;
  border:1px solid transparent;
}
.tag.crit{color:var(--crit);background:var(--crit-bg);border-color:var(--crit-line)}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.tag.ok{color:var(--ok);background:rgba(14,158,105,.10);border-color:rgba(14,158,105,.35)}
.tag.muted{color:var(--text-faint);background:var(--chip);border-color:var(--line)}
.tag.draft{color:var(--text-faint);background:var(--chip);border-color:var(--line);text-transform:uppercase;letter-spacing:.05em;font-size:9.5px}
.pipe{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-faint);white-space:nowrap}
.pipe .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint)}
.pipe.ok .dot{background:var(--ok)}
.pipe.run .dot{background:var(--blue);animation:pulse 1.4s ease-in-out infinite}

.who{
  flex:none;width:104px;text-align:right;font-size:11.5px;color:var(--text-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.who.bot{color:var(--text-faint)}
.who.bot::before{
  content:"BOT";font-size:8.5px;font-weight:700;letter-spacing:.06em;
  border:1px solid var(--line-strong);border-radius:3px;padding:0 3px;margin-right:5px;
  color:var(--text-faint);vertical-align:1px;
}
.when{flex:none;width:34px;text-align:right;font-size:11.5px;color:var(--text-faint)}

.acts{flex:none;display:flex;align-items:center;gap:2px;width:76px;justify-content:flex-end}
.acts button{
  width:24px;height:24px;border-radius:5px;display:grid;place-items:center;
  color:var(--text-faint);opacity:0;transition:opacity .1s;
}
.acts button.copy{opacity:.38}
.acts button.fav{font-size:14px;opacity:.38}
.acts button.fav.on{opacity:1;color:var(--warn)}
.row:hover .acts button,.acts button:focus-visible,.acts button.busy,.acts button.done{opacity:1}
.acts button:hover{background:var(--chip);color:var(--text)}
.acts button.fav:hover{color:var(--warn)}
.acts button.retry{color:var(--crit);opacity:.85}
.acts button.retry:hover{background:var(--crit-bg);color:var(--crit);opacity:1}
.acts button.done{color:var(--ok)}
.acts button.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
svg{display:block}

.empty{text-align:center;color:var(--text-faint);padding:48px 0;font-size:13px}
.empty b{display:block;font-size:15px;color:var(--text-dim);margin-bottom:4px}

@media (max-width:640px){
  .who{width:74px}
  .acts button{opacity:1}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="dots"><i></i><i></i><i></i></span>
      <b>MR Triage</b>
      <span class="alarm" id="alarm"><span class="pulse"></span><span id="alarmText"></span></span>
    </div>
    <div class="seg" role="group" aria-label="Group by">
      <button id="byRepo" aria-pressed="true">Repo</button>
      <button id="byAuthor" aria-pressed="false">Author</button>
    </div>
    <div class="seg" role="group" aria-label="Sort by">
      <button id="sortPriority" aria-pressed="true">Priority</button>
      <button id="sortDate" aria-pressed="false">Date</button>
      <button id="sortCreator" aria-pressed="false">Creator</button>
    </div>
    <div class="notify-wrap">
      <button id="notifyBtn" class="bell" aria-pressed="false" title="Click to enable notifications">🔔</button>
      <button id="notifySettingsBtn" class="gear" title="Notification settings" aria-expanded="false">⚙</button>
      <div id="notifyPanel" class="notify-panel" hidden></div>
    </div>
    <div class="status" id="status">loading…</div>
  </header>

  <div id="warnings"></div>
  <div id="watched"></div>
  <main id="list"></main>
</div>

<script>
(function(){
"use strict";

/* ── state ─────────────────────────────────────────────── */
var LS_MODE='wf.mode', LS_CLOSED='wf.closed', LS_SORT='wf.sort', LS_FAVS='wf.favorites';
var mode = localStorage.getItem(LS_MODE)==='author' ? 'author' : 'repo';
var SORTS=['priority','date','creator'];
var sortMode = SORTS.indexOf(localStorage.getItem(LS_SORT))>=0 ? localStorage.getItem(LS_SORT) : 'priority';
var closed = new Set();
try{ (JSON.parse(localStorage.getItem(LS_CLOSED))||[]).forEach(function(k){closed.add(k);}); }catch(e){}
var favorites = new Set();
try{ (JSON.parse(localStorage.getItem(LS_FAVS))||[]).forEach(function(k){favorites.add(k);}); }catch(e){}
function toggleFavorite(project){
  if(favorites.has(project)) favorites.delete(project); else favorites.add(project);
  localStorage.setItem(LS_FAVS, JSON.stringify(Array.from(favorites)));
  render();
}

// ponytail: an ordered array, not a Set — drag-to-reorder needs a position
// to mean something, and the persisted shape (JSON array) hasn't changed
var LS_FAV_MRS='wf.favMrs';
var favMrs = [];
try{ var f=JSON.parse(localStorage.getItem(LS_FAV_MRS)); if(Array.isArray(f)) favMrs=f; }catch(e){}
function isMrFavorited(url){ return favMrs.indexOf(url)>=0; }
function saveFavMrs(){ localStorage.setItem(LS_FAV_MRS, JSON.stringify(favMrs)); }
function toggleFavoriteMr(url){
  var i=favMrs.indexOf(url);
  if(i>=0) favMrs.splice(i,1); else favMrs.push(url);
  saveFavMrs();
  render();
}
// targetUrl null means "drop past the last row" — always to the very end.
// after=true inserts below the target row instead of above it, so dropping
// on the bottom half of the last row (or the empty space below it) actually
// reaches the last position instead of landing just above it.
function reorderFavMrs(draggedUrl,targetUrl,after){
  if(draggedUrl===targetUrl) return;
  var i=favMrs.indexOf(draggedUrl);
  if(i<0) return;
  favMrs.splice(i,1);
  if(targetUrl==null){ favMrs.push(draggedUrl); saveFavMrs(); render(); return; }
  var j=favMrs.indexOf(targetUrl);
  if(j<0) j=favMrs.length; else if(after) j+=1;
  favMrs.splice(j, 0, draggedUrl);
  saveFavMrs();
  render();
}
var data=null, fetchedAt=null, fetchError=null, demo=false, tickTimer=null;
var seenGroups = new Set();   // groups we've already applied default-collapse to

var BOT=/bot|renovate|dependabot/i;
var $=function(s){return document.querySelector(s);};

/* ── fetch loop ────────────────────────────────────────── */
var POLL_MS=15000, nextPollAt=Date.now()+POLL_MS;
function load(){
  nextPollAt=Date.now()+POLL_MS;
  if(demo){ apply(DEMO_DATA); return; }
  fetch('/api/mrs',{headers:{'Accept':'application/json'}})
    .then(function(r){
      if(r.status===404){ demo=true; throw {demo:true}; }
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(apply)
    .catch(function(e){
      if(e && e.demo){ apply(DEMO_DATA); return; }
      fetchError = (e && e.message) || 'fetch failed';
      render();
    });
}
function apply(d){
  data=d; fetchError=d.error||null;
  fetchedAt = d.fetchedAt ? new Date(d.fetchedAt) : new Date();
  checkTransitions(d.groups||[]);
  render();
}

/* ── notifications ─────────────────────────────────────── */
var LS_NOTIFY='wf.notify';
var notifyEnabled = localStorage.getItem(LS_NOTIFY)==='1' && ('Notification' in window) && Notification.permission==='granted';
var prevMrState = new Map();   // web_url -> {pipeline, approved, merge_status}
var primed = false;            // skip notifying on the very first load (no "transition" yet)

// ponytail: "new MR opened" fires whenever an MR is first seen — that also
// happens if it just entered scope (added to repos.json, recovered from a
// transient fetch error), not only on genuine creation. "merged or closed"
// can't be told apart without an extra API call once an MR leaves the
// state=opened feed, so we guess from its last known merge_status. Both are
// off by default for that reason; the rest are precise, so on by default.
var NOTIFY_TYPES=[
  {key:'pipelineFailed', label:'Pipeline failed', def:true},
  {key:'approved', label:'MR approved', def:true},
  {key:'mergeable', label:'Ready to merge', def:true},
  {key:'opened', label:'New MR opened', def:false},
  {key:'closedOrMerged', label:'MR merged or closed', def:false}
];
var LS_NOTIFY_TYPES='wf.notifyTypes';
var notifyTypes=(function(){
  var stored={}; try{ stored=JSON.parse(localStorage.getItem(LS_NOTIFY_TYPES))||{}; }catch(e){}
  var out={};
  NOTIFY_TYPES.forEach(function(t){ out[t.key] = (t.key in stored) ? !!stored[t.key] : t.def; });
  return out;
})();
function saveNotifyTypes(){ localStorage.setItem(LS_NOTIFY_TYPES, JSON.stringify(notifyTypes)); }

function notify(title,body,url){
  if(!notifyEnabled || !('Notification' in window) || Notification.permission!=='granted') return;
  var n=new Notification(title,{body:body,tag:url});
  n.onclick=function(){ window.open(url,'_blank'); window.focus(); n.close(); };
}

function checkTransitions(groups){
  var seen=new Set();
  groups.forEach(function(g){
    g.mrs.forEach(function(mr){
      seen.add(mr.web_url);
      var prev=prevMrState.get(mr.web_url);
      var ps=pstat(mr);
      var label=short(g.project).last+' · '+mr.title;
      if(primed){
        if(!prev){
          if(notifyTypes.opened) notify('New MR opened', label, mr.web_url);
        }else{
          if(notifyTypes.pipelineFailed && ps==='failed' && prev.pipeline!=='failed') notify('Pipeline failed', label, mr.web_url);
          if(notifyTypes.approved && mr.approved && !prev.approved) notify('MR approved', label, mr.web_url);
          if(notifyTypes.mergeable && mr.merge_status==='mergeable' && prev.merge_status!=='mergeable') notify('Ready to merge', label, mr.web_url);
        }
      }
      prevMrState.set(mr.web_url,{pipeline:ps,approved:mr.approved,merge_status:mr.merge_status,project:g.project,title:mr.title});
    });
  });
  Array.from(prevMrState.entries()).forEach(function(entry){
    var k=entry[0], v=entry[1];
    if(seen.has(k)) return;
    if(primed && notifyTypes.closedOrMerged){
      var label=short(v.project).last+' · '+v.title;
      notify(v.merge_status==='mergeable' ? 'MR merged' : 'MR closed', label, k);
    }
    prevMrState.delete(k);
  });
  primed=true;
}

function updateNotifyBtn(){
  var b=$('#notifyBtn');
  if(!('Notification' in window)){ b.disabled=true; b.title='Notifications not supported by this browser'; return; }
  if(Notification.permission==='denied'){ b.disabled=true; b.setAttribute('aria-pressed','false'); b.title='Blocked — re-enable in browser site settings'; return; }
  b.setAttribute('aria-pressed', String(notifyEnabled));
  b.title = notifyEnabled ? 'Notifications on — click to turn off' : 'Click to enable notifications';
}
$('#notifyBtn').addEventListener('click',function(){
  if(!('Notification' in window)) return;
  if(Notification.permission==='granted'){
    notifyEnabled=!notifyEnabled;
    localStorage.setItem(LS_NOTIFY, notifyEnabled?'1':'0');
    updateNotifyBtn();
  }else if(Notification.permission!=='denied'){
    Notification.requestPermission().then(function(p){
      if(p==='granted'){ notifyEnabled=true; localStorage.setItem(LS_NOTIFY,'1'); }
      updateNotifyBtn();
    });
  }
});
updateNotifyBtn();

/* ── notification settings panel ──────────────────────── */
(function(){
  var panel=$('#notifyPanel');
  var h=el('h4',null,'Notify me when');
  panel.appendChild(h);
  NOTIFY_TYPES.forEach(function(t){
    var label=el('label');
    var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=notifyTypes[t.key];
    cb.addEventListener('change',function(){ notifyTypes[t.key]=cb.checked; saveNotifyTypes(); });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(t.label));
    panel.appendChild(label);
  });
  var gear=$('#notifySettingsBtn');
  function closePanel(){ panel.hidden=true; gear.setAttribute('aria-expanded','false'); }
  gear.addEventListener('click',function(e){
    e.stopPropagation();
    var open=panel.hidden;
    panel.hidden=!open;
    gear.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click',function(e){
    if(!panel.hidden && !panel.contains(e.target) && e.target!==gear) closePanel();
  });
})();

/* ── helpers ───────────────────────────────────────────── */
function ago(iso){
  var s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);
  if(s<60) return Math.floor(s)+'s';
  if(s<3600) return Math.floor(s/60)+'m';
  if(s<86400) return Math.floor(s/3600)+'h';
  if(s<86400*7) return Math.floor(s/86400)+'d';
  return Math.floor(s/604800)+'w';
}
function pstat(mr){ return mr.pipeline && mr.pipeline.status ? mr.pipeline.status : null; }
function broken(mr){ var s=pstat(mr); return s==='failed'||s==='canceled'; }
function level(mr){
  if(broken(mr)) return 'crit';
  if(mr.needs_rebase||mr.needs_re_review||mr.urgent) return 'warn';
  return 'ok';
}
function short(p){ var i=p.lastIndexOf('/'); return i<0?{pre:'',last:p}:{pre:p.slice(0,i+1),last:p.slice(i+1)}; }
// ponytail: deterministic color per group label, so the same repo/author
// always gets the same avatar hue across renders/reloads — no config, no lookup table
function hueOf(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h)%360; }

// ponytail: bots always sink to the bottom of their group, whatever the
// chosen sort — that's the whole point of the toggle. `sortMode` only
// decides how the non-bot rows (and, within it, the bot rows) are ordered.
function sortRows(mrs){
  function cmp(a,b){
    if(sortMode==='date') return new Date(b.updated_at)-new Date(a.updated_at);
    if(sortMode==='creator') return (a.author||'').localeCompare(b.author||'') || new Date(b.updated_at)-new Date(a.updated_at);
    var ux=(level(a)!=='ok')?0:1, uy=(level(b)!=='ok')?0:1;
    if(ux!==uy) return ux-uy;
    return new Date(b.updated_at)-new Date(a.updated_at);
  }
  var humans=[], bots=[];
  mrs.forEach(function(m){ (BOT.test(m.author||'')?bots:humans).push(m); });
  humans.sort(cmp); bots.sort(cmp);
  return humans.concat(bots);
}
function el(tag,cls,txt){ var n=document.createElement(tag); if(cls)n.className=cls; if(txt!=null)n.textContent=txt; return n; }
function icon(d,extra){
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 16 16'); s.setAttribute('width','14'); s.setAttribute('height','14');
  s.setAttribute('fill','none'); s.setAttribute('stroke','currentColor');
  s.setAttribute('stroke-width', extra||'1.6');
  s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
  var p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d); s.appendChild(p); return s;
}
var I={
  caret:'M4 6l4 4 4-4',
  retry:'M13.5 8a5.5 5.5 0 1 1-1.7-3.9M13.5 2v3.2h-3.2',
  copy :'M5.5 5.5V3.2A1.2 1.2 0 0 1 6.7 2h6.1A1.2 1.2 0 0 1 14 3.2v6.1a1.2 1.2 0 0 1-1.2 1.2h-2.3M3.2 5.5h6.1A1.2 1.2 0 0 1 10.5 6.7v6.1A1.2 1.2 0 0 1 9.3 14H3.2A1.2 1.2 0 0 1 2 12.8V6.7a1.2 1.2 0 0 1 1.2-1.2Z',
  check:'M3 8.4l3.2 3.2L13 4.8'
};

/* ── grouping ──────────────────────────────────────────── */
function buildWatchedMrs(){
  if(!data||!data.groups) return [];
  var byUrl={};
  data.groups.forEach(function(g){
    g.mrs.forEach(function(mr){ byUrl[mr.web_url]=Object.assign({},mr,{_project:g.project}); });
  });
  // manual drag order wins here, not sortRows — that's the whole point of favoriting individual MRs
  var ordered=[];
  favMrs.forEach(function(url){ if(byUrl[url]) ordered.push(byUrl[url]); });
  return ordered;
}

function buildWatched(){
  if(!data||!data.groups) return [];
  return data.groups
    .filter(function(g){ return favorites.has(g.project); })
    .map(function(g){ return {key:'repo:'+g.project, label:g.project, kind:'repo', short:g.short, mrs:sortRows(g.mrs.slice()), bot:false}; })
    .sort(function(a,b){ return Number(b.mrs.some(function(m){return level(m)==='crit';})) - Number(a.mrs.some(function(m){return level(m)==='crit';})) || a.label.localeCompare(b.label); });
}

function buildGroups(){
  var groups=[];
  if(!data||!data.groups) return groups;
  if(mode==='repo'){
    data.groups.filter(function(g){ return !favorites.has(g.project); }).forEach(function(g){
      groups.push({key:'repo:'+g.project, label:g.project, kind:'repo', short:g.short, mrs:sortRows(g.mrs.slice()), bot:false});
    });
  }else{
    var by={};
    data.groups.forEach(function(g){
      if(favorites.has(g.project)) return;
      g.mrs.forEach(function(mr){
        var a=mr.author||'unknown';
        (by[a]=by[a]||[]).push(Object.assign({},mr,{_project:g.project}));
      });
    });
    Object.keys(by).forEach(function(a){
      groups.push({key:'author:'+a, label:a, kind:'author', mrs:sortRows(by[a].slice()), bot:BOT.test(a)});
    });
    groups.sort(function(a,b){
      if(a.bot!==b.bot) return a.bot?1:-1;
      var ca=a.mrs.filter(function(m){return level(m)==='crit';}).length;
      var cb=b.mrs.filter(function(m){return level(m)==='crit';}).length;
      if(ca!==cb) return cb-ca;
      return b.mrs.length-a.mrs.length;
    });
  }
  return groups;
}

/* ── render ────────────────────────────────────────────── */
function render(){
  renderStatus(); renderWarnings();

  var watched=$('#watched'); watched.textContent='';
  var watchedMrs=buildWatchedMrs();
  if(watchedMrs.length){
    watched.appendChild(el('div','section-label','★ Followed MRs'));
    watched.appendChild(groupEl({key:'pinned-mrs',label:'Followed MRs',kind:'author',short:'MR',bot:false,mrs:watchedMrs},{pinned:true}));
  }
  var watchedGroups=buildWatched();
  if(watchedGroups.length){
    watched.appendChild(el('div','section-label','★ Watched repos'));
    watchedGroups.forEach(function(g){ watched.appendChild(groupEl(g,{pinned:true})); });
  }

  var list=$('#list'), groups=buildGroups();
  list.textContent='';

  var crit=0;
  (data&&data.groups||[]).forEach(function(g){ g.mrs.forEach(function(m){ if(level(m)==='crit') crit++; }); });
  var alarm=$('#alarm');
  alarm.classList.toggle('on', crit>0);
  $('#alarmText').textContent = crit + (crit===1?' needs attention':' need attention');

  if(!groups.length){
    var e=el('div','empty'); e.appendChild(el('b',null,'All clear'));
    e.appendChild(document.createTextNode(fetchError?'Nothing loaded.':((watchedGroups.length||watchedMrs.length)?'Nothing else open.':'No open merge requests.')));
    list.appendChild(e); return;
  }

  groups.forEach(function(g){
    // default-collapse bot author groups the first time we ever see them
    if(!seenGroups.has(g.key)){
      seenGroups.add(g.key);
      if(g.bot && !g.mrs.some(function(m){return level(m)==='crit';})) closed.add(g.key);
    }
    list.appendChild(groupEl(g));
  });
}

function groupEl(g,opts){
  opts=opts||{};
  var crit=g.mrs.filter(function(m){return level(m)==='crit';}).length;
  var warn=g.mrs.filter(function(m){return level(m)==='warn';}).length;

  var d=el('details','group'+(opts.pinned?' pinned':''));
  d.open = opts.pinned ? true : !closed.has(g.key);
  if(!opts.pinned){
    d.addEventListener('toggle',function(){
      if(d.open) closed.delete(g.key); else closed.add(g.key);
      localStorage.setItem(LS_CLOSED, JSON.stringify(Array.from(closed)));
    });
  }

  var s=el('summary');
  var c=icon(I.caret,'1.8'); c.classList.add('caret'); s.appendChild(c);

  var lastSegment = g.kind==='repo' ? short(g.label).last : g.label;
  var avatarText = (g.short || lastSegment[0] || '?').toUpperCase();
  var av=el('span','gavatar',avatarText);
  if(avatarText.length>1){ av.style.width='auto'; av.style.padding='0 5px'; }
  av.style.background='hsl('+hueOf(g.label)+'deg 52% 42%)';
  s.appendChild(av);

  var name=el('span','gname');
  if(g.kind==='repo'){
    var p=short(g.label);
    name.appendChild(el('span','dim',p.pre));
    name.appendChild(document.createTextNode(p.last));
  }else{
    name.textContent=g.label;
  }
  s.appendChild(name);
  if(g.bot) s.appendChild(el('span','badge bot','bot'));

  var meta=el('span','gmeta');
  if(crit) meta.appendChild(el('span','badge crit',crit+' failing'));
  else if(warn) meta.appendChild(el('span','badge warn',warn+' to do'));
  meta.appendChild(el('span','count',g.mrs.length));
  if(g.kind==='repo'){
    var isFav=favorites.has(g.label);
    var favBtn=el('button','favBtn'+(isFav?' on':''),isFav?'★':'☆');
    favBtn.title=isFav?'Unwatch':'Watch this repo';
    favBtn.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); toggleFavorite(g.label); });
    meta.appendChild(favBtn);
  }
  s.appendChild(meta);
  d.appendChild(s);

  var rows=el('div','rows');
  var draggableGroup = g.key==='pinned-mrs';
  g.mrs.forEach(function(mr){ rows.appendChild(rowEl(mr,g,{draggable:draggableGroup})); });
  d.appendChild(rows);

  if(draggableGroup && g.mrs.length){
    var dropEnd=el('div','drop-end');
    dropEnd.addEventListener('dragover',function(e){ e.preventDefault(); e.dataTransfer.dropEffect='move'; dropEnd.classList.add('over'); });
    dropEnd.addEventListener('dragleave',function(){ dropEnd.classList.remove('over'); });
    dropEnd.addEventListener('drop',function(e){
      e.preventDefault(); dropEnd.classList.remove('over');
      reorderFavMrs(e.dataTransfer.getData('text/plain'), null);
    });
    d.appendChild(dropEnd);
  }
  return d;
}

function rowEl(mr,g,opts){
  opts=opts||{};
  var lv=level(mr), isBot=BOT.test(mr.author||'');
  var r=el('div','row '+lv);
  if(mr.draft) r.classList.add('draft');
  if(lv==='ok' && (isBot||mr.draft||mr.relationship==='other')) r.classList.add('quiet');

  if(opts.draggable){
    var grip=el('span','grip','⠿'); grip.title='Drag to reorder';
    grip.draggable=true;
    grip.addEventListener('dragstart',function(e){ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', mr.web_url); r.classList.add('dragging'); });
    grip.addEventListener('dragend',function(){ r.classList.remove('dragging'); });
    r.appendChild(grip);
    r.addEventListener('dragover',function(e){ e.preventDefault(); e.dataTransfer.dropEffect='move'; });
    r.addEventListener('drop',function(e){
      e.preventDefault(); e.stopPropagation();
      var rect=r.getBoundingClientRect();
      var after = e.clientY > rect.top + rect.height/2;
      reorderFavMrs(e.dataTransfer.getData('text/plain'), mr.web_url, after);
    });
  }

  var rel=el('span','rel '+(mr.relationship||'other'));
  rel.title = mr.relationship==='authored' ? 'You authored this'
            : mr.relationship==='reviewing' ? 'Your review is requested'
            : 'Activity in a repo you own';
  r.appendChild(rel);

  var main=el('div','main');
  if(mr.draft) main.appendChild(el('span','tag draft','draft'));
  var a=el('a','title',mr.title); a.href=mr.web_url; a.target='_blank'; a.rel='noopener';
  a.title = (g.kind==='author' && mr._project ? mr._project+' · ' : '') + mr.title;
  main.appendChild(a);

  var tags=el('span','tags');
  var ps=pstat(mr);
  if(ps==='failed') tags.appendChild(el('span','tag crit','pipeline failed'));
  else if(ps==='canceled') tags.appendChild(el('span','tag crit','pipeline canceled'));
  else if(ps==='running'||ps==='pending'){ var pr=el('span','pipe run'); pr.appendChild(el('i','dot')); pr.appendChild(el('span',null,ps)); tags.appendChild(pr); }
  else if(ps==='success'){ var po=el('span','pipe ok'); po.title='pipeline passed'; po.appendChild(el('i','dot')); tags.appendChild(po); }
  if(mr.needs_rebase) tags.appendChild(el('span','tag warn','rebase'));
  if(mr.needs_re_review) tags.appendChild(el('span','tag warn','re-review'));
  else if(mr.approved) tags.appendChild(el('span','tag ok','approved'));
  else if(mr.approvals_left) tags.appendChild(el('span','tag muted','awaiting approval'));
  main.appendChild(tags);
  r.appendChild(main);

  var who=el('div','who'+(isBot?' bot':''), mr.author||'—');
  who.title = (mr.author||'') + (g.kind==='author' && mr._project ? ' · '+mr._project : '');
  if(g.kind==='author' && mr._project){ who.textContent = short(mr._project).last; who.classList.remove('bot'); }
  r.appendChild(who);

  var when=el('div','when',ago(mr.updated_at)); when.title=new Date(mr.updated_at).toLocaleString();
  when.dataset.at=mr.updated_at;
  r.appendChild(when);

  var acts=el('div','acts');
  var isFavMr=isMrFavorited(mr.web_url);
  var fb=el('button','fav'+(isFavMr?' on':''), isFavMr?'★':'☆');
  fb.title=isFavMr?'Unfollow':'Follow this MR';
  fb.addEventListener('click',function(){ toggleFavoriteMr(mr.web_url); });
  acts.appendChild(fb);
  if(broken(mr) && mr.pipeline){
    var rb=el('button','retry'); rb.title='Retry pipeline'; rb.setAttribute('aria-label','Retry pipeline');
    rb.appendChild(icon(I.retry));
    rb.addEventListener('click',function(){ retry(mr,rb); });
    acts.appendChild(rb);
  }
  var cb=el('button','copy'); cb.title='Copy link'; cb.setAttribute('aria-label','Copy link');
  cb.appendChild(icon(I.copy,'1.4'));
  cb.addEventListener('click',function(){ copy(mr.web_url,cb); });
  acts.appendChild(cb);
  r.appendChild(acts);
  return r;
}

function renderStatus(){
  var s=$('#status'); s.textContent=''; s.className='status';
  var ring=el('span','ring'); ring.id='ring'; ring.title='next refresh';
  s.appendChild(ring);
  if(demo){ s.appendChild(el('span','demo','demo data')); }
  if(fetchError){ s.classList.add('err'); s.appendChild(el('span',null,'fetch error: '+fetchError)); return; }
  s.appendChild(el('span',null, fetchedAt ? 'updated '+ago(fetchedAt.toISOString())+' ago' : 'loading…'));
}

function renderWarnings(){
  var box=$('#warnings'); box.textContent='';
  var w = data && data.warnings || [];
  if(!w.length) return;
  var d=el('div','warns');
  d.appendChild(el('h3',null,'Config problem'+(w.length>1?'s':'')));
  var ul=el('ul');
  w.forEach(function(x){ ul.appendChild(el('li',null,x)); });
  d.appendChild(ul); box.appendChild(d);
}

/* ── actions ───────────────────────────────────────────── */
function retry(mr,btn){
  var pid = mr.project_id!=null ? mr.project_id : encodeURIComponent(mr._project||mr.project||'');
  btn.classList.add('busy'); btn.disabled=true;
  if(demo){ setTimeout(function(){ btn.classList.remove('busy'); btn.disabled=false; },1200); return; }
  fetch('/api/pipelines/'+pid+'/'+mr.pipeline.id+'/retry',{method:'POST'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); })
    .catch(function(){ btn.title='Retry failed'; })
    .then(function(){ btn.classList.remove('busy'); btn.disabled=false; setTimeout(load,1200); });
}
function copy(url,btn){
  var done=function(){
    btn.textContent=''; btn.appendChild(icon(I.check)); btn.classList.add('done');
    setTimeout(function(){ btn.textContent=''; btn.appendChild(icon(I.copy,'1.4')); btn.classList.remove('done'); },1100);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done,fallback);
  } else fallback();
  function fallback(){
    var t=document.createElement('textarea'); t.value=url; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    document.body.removeChild(t);
  }
}
