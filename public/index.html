<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wayfinder</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.4 -apple-system, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
  h2 { margin: 2rem 0 .25rem; font-size: 1rem; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #8883; vertical-align: middle; }
  a { color: inherit; }
  .badge { display: inline-block; padding: .1rem .5rem; border-radius: 1rem; font-size: .75rem; font-weight: 600; margin-right: .25rem; }
  .success { background: #1a7f371a; color: #1a7f37; }
  .failed { background: #cf222e1a; color: #cf222e; }
  .running, .pending { background: #9a67001a; color: #9a6700; }
  .canceled, .skipped { background: #6e76811a; color: #6e7681; }
  .rebase, .rereview { background: #9a67001a; color: #9a6700; }
  .draft { background: #6e76811a; color: #6e7681; }
  .relationship { font-size: .7rem; text-transform: uppercase; letter-spacing: .03em; opacity: .55; }
  button { font-size: .75rem; padding: .2rem .5rem; cursor: pointer; margin-right: .25rem; }
  #status { opacity: .5; font-size: .75rem; }
  .muted { opacity: .6; }
  tr.draft-row { opacity: .6; }
  #warnings { background: #cf222e14; color: #cf222e; border: 1px solid #cf222e33; border-radius: 6px; padding: .5rem .75rem; margin-top: .5rem; font-size: .8rem; display: none; }
  #warnings ul { margin: .25rem 0 0; padding-left: 1.2rem; }
  .bot { background: #6e76811a; color: #6e7681; }
  #groupBy { margin: .5rem 0 0; font-size: .8rem; }
  #groupBy button { background: none; border: 1px solid #8886; border-radius: 4px; }
  #groupBy button.active { background: #8883; font-weight: 600; }
  details > summary { cursor: pointer; list-style: none; margin: 2rem 0 .25rem; font-size: 1rem; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▾ "; }
  details:not([open]) > summary::before { content: "▸ "; }
</style>
</head>
<body>
<h1>wayfinder</h1>
<div id="status">loading…</div>
<div id="warnings"></div>
<div id="groupBy">
  group by
  <button data-group="repo" class="active">repo</button>
  <button data-group="author">author</button>
</div>
<div id="groups"></div>

<script>
function timeAgo(iso) {
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}

function statusBadges(mr) {
  const badges = [];
  if (mr.pipeline) badges.push(`<span class="badge ${mr.pipeline.status}">${mr.pipeline.status}</span>`);
  if (mr.needs_rebase) badges.push(`<span class="badge rebase">needs rebase</span>`);
  if (mr.needs_re_review) badges.push(`<span class="badge rereview">needs re-review</span>`);
  return badges.join("") || `<span class="muted">—</span>`;
}

const isBot = (username) => /bot|renovate|dependabot/i.test(username);

function row(mr) {
  const retryBtn = mr.pipeline && ["failed", "canceled"].includes(mr.pipeline.status)
    ? `<button data-retry="${mr.project_id}:${mr.pipeline.id}">retry</button>`
    : "";
  return `<tr class="${mr.draft ? "draft-row" : ""}">
    <td><a href="${mr.web_url}" target="_blank">${mr.title}</a>${mr.draft ? ' <span class="badge draft">draft</span>' : ""}</td>
    <td class="relationship">${mr.relationship}</td>
    <td class="muted">${mr.author}${isBot(mr.author) ? ' <span class="badge bot">bot</span>' : ""}</td>
    <td>${statusBadges(mr)}</td>
    <td class="muted">${timeAgo(mr.updated_at)}</td>
    <td>${retryBtn}<button data-copy="${mr.web_url}">copy link</button></td>
  </tr>`;
}

// ponytail: collapse state lives in a plain Set, keyed by "mode:label" so
// switching group-by modes doesn't leak collapsed state across them
const collapsed = new Set();

function group(g, mode) {
  const key = `${mode}:${g.label}`;
  return `<details ${collapsed.has(key) ? "" : "open"} data-key="${key}">
    <summary>${g.label} <span class="muted">(${g.mrs.length})</span></summary>
    <table><tbody>${g.mrs.map(row).join("")}</tbody></table>
  </details>`;
}

function byUrgencyThenLabel(a, b) {
  return Number(b.mrs.some((m) => m.urgent)) - Number(a.mrs.some((m) => m.urgent)) || a.label.localeCompare(b.label);
}

function regroupByAuthor(repoGroups) {
  const byAuthor = new Map();
  for (const g of repoGroups) {
    for (const mr of g.mrs) {
      if (!byAuthor.has(mr.author)) byAuthor.set(mr.author, []);
      byAuthor.get(mr.author).push(mr);
    }
  }
  const byUrgencyThenRecency = (a, b) =>
    Number(b.urgent) - Number(a.urgent) || new Date(b.updated_at) - new Date(a.updated_at);
  return [...byAuthor.entries()]
    .map(([label, mrs]) => ({ label, mrs: mrs.sort(byUrgencyThenRecency) }))
    .sort(byUrgencyThenLabel);
}

let groupMode = "repo";
let lastData = null;

function render() {
  if (!lastData) return;
  const groups = groupMode === "repo"
    ? lastData.groups.map((g) => ({ label: g.project, mrs: g.mrs })).sort(byUrgencyThenLabel)
    : regroupByAuthor(lastData.groups);

  document.getElementById("groups").innerHTML =
    groups.length ? groups.map((g) => group(g, groupMode)).join("") : `<p class="muted">nothing open</p>`;
}

async function tick() {
  const res = await fetch("/api/mrs");
  lastData = await res.json();
  render();

  document.getElementById("status").textContent = lastData.error
    ? `error: ${lastData.error}`
    : `updated ${timeAgo(lastData.fetchedAt)}`;

  const warnings = document.getElementById("warnings");
  if (lastData.warnings?.length) {
    warnings.style.display = "block";
    warnings.innerHTML = `${lastData.warnings.length} problem(s) fetching data:<ul>${lastData.warnings.map((w) => `<li>${w}</li>`).join("")}</ul>`;
  } else {
    warnings.style.display = "none";
  }
}

document.body.addEventListener("click", async (e) => {
  if (e.target.dataset.copy) {
    navigator.clipboard.writeText(e.target.dataset.copy);
    e.target.textContent = "copied!";
    setTimeout(() => (e.target.textContent = "copy link"), 1000);
  }
  if (e.target.dataset.retry) {
    const [projectId, pipelineId] = e.target.dataset.retry.split(":");
    e.target.textContent = "retrying…";
    e.target.disabled = true;
    await fetch(`/api/pipelines/${projectId}/${pipelineId}/retry`, { method: "POST" });
    tick();
  }
  if (e.target.dataset.group) {
    groupMode = e.target.dataset.group;
    document.querySelectorAll("#groupBy button").forEach((b) => b.classList.toggle("active", b === e.target));
    render();
  }
});

document.getElementById("groups").addEventListener("toggle", (e) => {
  const key = e.target.dataset.key;
  if (e.target.open) collapsed.delete(key);
  else collapsed.add(key);
}, true);

tick();
setInterval(tick, 15000);
</script>
</body>
</html>
